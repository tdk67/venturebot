# CI / CD — run tests on every push/PR, and deploy to Cloud Run on push to main if tests pass.
name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build TypeScript frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: python -m pytest tests -q

  deploy:
    name: Deploy to Cloud Run
    needs: [test]
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # WIF — keyless service-account auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build TypeScript frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/venturebot/venturebot
        run: |
          gcloud builds submit \
            --tag "$IMAGE:${GITHUB_SHA::12}" .

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/venturebot/venturebot
          SERVICE: venturebot
          REGION: ${{ vars.GCP_REGION }}
          SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          FLAGS=(
            "--image=$IMAGE:${GITHUB_SHA::12}"
            "--region=$REGION"
            "--service-account=$SA"
            "--min-instances=0"
            "--memory=1Gi"
            "--allow-unauthenticated"
            "--set-env-vars=VENTUREBOT_NO_AUTH=1,VENTUREBOT_COOKIE_SECURE=true"
          )
          gcloud run deploy "$SERVICE" "${FLAGS[@]}" --quiet

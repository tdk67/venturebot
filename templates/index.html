<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Lint — Startup Idea Validator</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  body { background: #0f172a; color: #e2e8f0; }
  .card { background: #020617; border: 1px solid #1e293b; border-radius: 1rem; padding: 1.5rem; }
  .btn-primary { background: #059669; }
  .btn-primary:hover { background: #047857; }
  .input { background: #0f172a; border: 1px solid #334155; border-radius: .5rem; padding: .6rem .9rem; color: #e2e8f0; outline: none; }
  .input:focus { border-color: #3b82f6; }
  .hint { color: #f59e0b; font-size: .75rem; }
  .status { font-size: .8rem; color: #94a3b8; }
</style>
</head>
<body class="min-h-screen">
<main class="max-w-3xl mx-auto p-6">
  <header class="mb-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="/static/logo.svg" alt="" class="h-9" onerror="this.style.display='none'">
      <h1 class="text-2xl font-black text-white">Venture<span class="text-blue-500">Bot</span></h1>
    </div>
    <span class="text-xs text-slate-500">Idea Lint — your ideas stay in this browser</span>
  </header>

  <!-- BYOK key UX (T8): enter + verify the user's own key. The stored key is
       never rendered back; the field only accepts NEW input. -->
  <section id="key-card" class="card mb-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-bold text-slate-300">Your model API key</h2>
      <span class="text-xs text-slate-500">stays in this browser</span>
    </div>
    <p id="key-status" class="text-xs mb-2" data-state="unknown">No key set yet. Open the form to add one.</p>
    <div id="key-form" class="hidden">
      <div class="flex gap-3">
        <input id="key-input" type="password" placeholder="sk-or-v1-… / AIza…"
               class="input flex-1" autocomplete="off" spellcheck="false">
        <button id="btn-key-verify" class="btn-primary px-4 py-2 rounded-lg font-bold text-white">Verify & save</button>
      </div>
      <p id="key-hint" class="hint hidden mt-2"></p>
    </div>
    <button id="btn-key-open" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold mt-2">＋ Set API key</button>
    <button id="btn-key-clear" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold mt-2">⌫ Remove key</button>
  </section>

  <section class="card mb-6">
    <label for="idea-input" class="block text-sm font-bold text-slate-300 mb-2">Add an idea to your list</label>
    <div class="flex gap-3">
      <input id="idea-input" type="text" placeholder="e.g. An app that helps gardeners track watering schedules"
             class="input flex-1" autocomplete="off">
      <button id="btn-add" class="btn-primary px-5 py-2 rounded-lg font-bold text-white">+ Add</button>
    </div>
    <p id="duplicate-hint" class="hint hidden mt-2"></p>
  </section>

  <div class="flex items-center justify-between mb-3">
    <h2 class="text-lg font-bold text-slate-200">Your ideas</h2>
    <div class="flex items-center gap-2">
      <button id="btn-export" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold">⬇ Export JSON</button>
      <button id="btn-import" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold">⬆ Import</button>
      <input id="import-file" type="file" accept="application/json,.json" class="hidden">
      <button id="btn-clear" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs font-bold">Clear all</button>
    </div>
  </div>
  <p id="idea-count" class="text-xs text-slate-500 mb-3">0 ideas</p>

  <div id="ideas-list" class="space-y-2"></div>
  <p id="ideas-empty" class="text-xs text-slate-500">No ideas yet — add one above.</p>

  <!-- Live debate view (T7) -->
  <section id="debate-run" class="card mt-6 hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-slate-200">Live debate</h2>
      <div class="flex items-center gap-2">
        <button id="btn-stop" class="px-3 py-1.5 rounded-lg bg-red-800 hover:bg-red-700 text-white text-xs font-bold hidden">■ Stop</button>
      </div>
    </div>
    <p id="debate-state" class="text-xs text-slate-400 mb-3" data-label="idle">idle · 0:00</p>
    <div id="debate-agents" class="flex flex-wrap gap-2 mb-4"></div>
    <div id="debate-error" class="hidden mb-4 p-3 rounded-lg bg-red-900/60 border border-red-700 text-sm text-red-100 font-semibold"></div>
    <div id="debate-done" class="hidden mb-4 p-4 rounded-lg bg-emerald-900/40 border border-emerald-700">
      <p id="debate-done-title" class="text-sm font-bold text-emerald-100"></p>
      <a id="debate-prd-link" href="#" class="text-xs text-emerald-300 underline"></a>
    </div>
  </section>

  <p id="status-line" class="status mt-6"></p>
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
